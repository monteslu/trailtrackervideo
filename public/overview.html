<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Trail Overview</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <nav style="margin-bottom: 20px;">
            <span style="margin-right: 20px; font-weight: bold; color: #333;">🚴‍♂️ Bike Trail</span>
            <a href="index.html" style="margin-right: 15px; text-decoration: none; color: #007bff;">Processor</a>
            <span style="margin-right: 15px; color: #fff; background-color: #007bff; padding: 5px 10px; border-radius: 4px;">Overview</span>
            <a href="detections.html" style="text-decoration: none; color: #007bff;">Detections</a>
        </nav>
        
        <div class="controls">
            <div class="control-group">
                <label for="sessionSelect">Select Session:</label>
                <select id="sessionSelect">
                    <option value="">Choose a session...</option>
                </select>
                <button id="loadBtn">Load Session</button>
                <span id="sessionInfo" style="display: none; margin-left: 15px;">Images: <span id="imageCount">0</span> | Distance: <span id="totalDistance">0</span></span>
            </div>
            
            <div class="map-controls" id="mapControls" style="display: none;">
                <div class="slider-group" style="display: flex; align-items: center; gap: 15px;">
                    <label for="zoomLevel">Zoom Level:</label>
                    <input type="range" id="zoomLevel" min="2" max="17" value="12" style="flex: 1;" />
                    <button id="zoomMinus" style="width: 30px; height: 30px;">-</button>
                    <button id="zoomPlus" style="width: 30px; height: 30px;">+</button>
                    <span id="zoomLevelValue">12</span>
                    <button id="animateBtn" style="margin-left: 15px;">🎬 Animate Path</button>
                    <button id="greyPathBtn" style="margin-left: 10px;">🌫️ Grey Path</button>
                    <button id="redPathBtn" style="margin-left: 5px;">🔴 Red Path</button>
                </div>
            </div>
        </div>

        <!-- Full-width map container -->
        <div id="mapContainer" style="width: 100%; height: 80vh; margin: 20px 0; display: none;">
            <div id="overviewMap" style="width: 100%; height: 100%;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="overview.js"></script>
</body>
</html>
